<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — Clipping Design System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>
<div class="au-page">
  <div class="dots-auth" style="position:absolute;inset:0;pointer-events:none"></div>
  <div class="amb" aria-hidden="true"><i class="o1"></i><i class="o2"></i><i class="o3"></i></div>

  <button class="btn-secondary themetog" onclick="tog()">Tema</button>

  <div class="au-wrap">
    <div class="au-logo st" style="animation-delay:.05s">
      <div class="au-logo-row">
        <span class="au-mark">C</span>
        <span>CLIPS</span>
      </div>
      <p>Panel de la comunidad</p>
    </div>

    <div class="au-card" id="card">
      <div class="au-card-in">
        <h2 class="au-title st" style="animation-delay:.2s">Iniciar sesión</h2>

        <button class="btn-social st" style="animation-delay:.26s">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
            <path fill="#FF3D00" d="m6.306 14.691 6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
            <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
            <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
          </svg>
          Continuar con Google
        </button>

        <div class="divider st" style="animation-delay:.32s"><i></i><span>o con email</span><i></i></div>

        <form onsubmit="return false">
          <div class="st" style="animation-delay:.38s">
            <label class="label" for="em">Email</label>
            <input id="em" class="input brand-focus" type="email" placeholder="tu@email.com" autocomplete="email">
          </div>

          <div class="st" style="animation-delay:.44s">
            <label class="label" for="pw">Contraseña</label>
            <div class="pass">
              <input id="pw" class="input brand-focus" type="password" placeholder="••••••••" autocomplete="current-password">
              <button type="button" class="eye" aria-label="Mostrar contraseña" title="Mostrar" onclick="eye(this)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <p class="forgot st" style="animation-delay:.47s"><a href="#">¿Has olvidado tu contraseña?</a></p>

          <button class="btn-brand st" style="animation-delay:.5s">Entrar al panel</button>
        </form>

        <p class="au-alt st" style="animation-delay:.55s">
          ¿No tienes cuenta? <a href="register.html">Crear cuenta</a>
        </p>
      </div>
    </div>

    <p class="au-foot st" style="animation-delay:.55s">Clips — panel de la comunidad</p>
  </div>
</div>

<script>
  function tog(){ const r=document.documentElement; r.dataset.theme = r.dataset.theme==='dark'?'light':'dark'; }
  function eye(b){ const i=b.parentElement.querySelector('input');
    const show = i.type==='password'; i.type = show?'text':'password';
    b.setAttribute('aria-label', show?'Ocultar contraseña':'Mostrar contraseña'); }
  (function(){
    const card = document.getElementById('card');
    if(!window.matchMedia('(hover: hover)').matches) return;
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    card.addEventListener('mousemove', e => {
      const r = card.getBoundingClientRect();
      const x = e.clientX - r.left, y = e.clientY - r.top;
      card.style.setProperty('--mx', x+'px');
      card.style.setProperty('--my', y+'px');
      const rx = ((y/r.height)-.5)*-2.4, ry = ((x/r.width)-.5)*2.4;
      card.style.transform = `perspective(1200px) rotateX(${rx}deg) rotateY(${ry}deg)`;
    });
    card.addEventListener('mouseleave', () => { card.style.transform=''; });
  })();
</script>
</body>
</html>
